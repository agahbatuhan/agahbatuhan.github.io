<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#33735f">
  <title>PatiCare | E-posta doğrulama</title>
  <meta name="description" content="PatiCare e-posta doğrulama sayfası">
  <style>
    :root { color-scheme: light; --green:#33735f; --ink:#26332f; --muted:#74817b; --line:#e2e8e3; }
    * { box-sizing:border-box; }
    body { min-height:100vh; display:grid; place-items:center; margin:0; padding:24px; color:var(--ink); background:radial-gradient(circle at 15% 10%,#dff1e8,transparent 34%),radial-gradient(circle at 90% 90%,#f7dfcd,transparent 35%),#f7f8f5; font-family:Arial,Helvetica,sans-serif; }
    main { width:min(470px,100%); padding:42px 34px; border:1px solid var(--line); border-radius:24px; background:#fff; box-shadow:0 24px 70px #2646381b; text-align:center; }
    .brand { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:34px; font:700 23px Georgia,serif; }
    .mark { width:38px; height:38px; display:grid; place-items:center; border-radius:13px 13px 13px 5px; color:#fff; background:var(--green); font:italic 700 25px Georgia,serif; }
    .check { width:72px; height:72px; display:grid; place-items:center; margin:0 auto 20px; border-radius:50%; color:var(--green); background:#e8f4ef; font-size:34px; font-weight:800; }
    h1 { margin:0; font:700 29px Georgia,serif; }
    p { margin:12px auto 0; max-width:340px; color:var(--muted); font-size:14px; line-height:1.65; }
    .note { margin-top:26px; padding-top:20px; border-top:1px solid var(--line); font-size:12px; }
    nav { display:flex; justify-content:center; flex-wrap:wrap; gap:8px 16px; margin-top:24px; }
    nav a { color:var(--green); font-size:12px; font-weight:700; text-decoration:none; }
    nav a:hover { text-decoration:underline; }
    .error .check { color:#a94438; background:#fff0ec; }
  </style>
</head>
<body>
  <main id="card">
    <div class="brand"><span class="mark">p</span><span>PatiCare</span></div>
    <div class="check" aria-hidden="true">✓</div>
    <h1 id="title">E-posta adresin doğrulandı</h1>
    <p id="message">PatiCare uygulamasına dönerek e-posta adresin ve şifrenle giriş yapabilirsin.</p>
    <nav aria-label="Yasal ve destek bağlantıları"><a href="privacy.html">Gizlilik Politikası</a><a href="account-deletion.html">Hesap Silme</a><a href="mailto:paticare.destek@gmail.com">Destek</a></nav>
    <p class="note">Bu pencereyi güvenle kapatabilirsin.</p>
  </main>
  <script>
    const params = new URLSearchParams(window.location.hash.slice(1));
    const error = params.get('error_description');
    if (error) {
      document.getElementById('card').classList.add('error');
      document.querySelector('.check').textContent = '!';
      document.getElementById('title').textContent = 'Doğrulama tamamlanamadı';
      document.getElementById('message').textContent = decodeURIComponent(error.replace(/\+/g, ' '));
    }
    if (window.location.hash) history.replaceState(null, '', window.location.pathname);
  </script>
</body>
</html>
